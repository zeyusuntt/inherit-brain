[project]
name = "inherit-brain"
version = "0.1.0"
description = "A company brain on FalkorDB over the Salesforce HERB benchmark"
requires-python = ">=3.11,<3.12"
dependencies = [
    "falkordb==1.8.0",
    "fastapi>=0.143.2",
    "graphrag-sdk==1.4.0",
    "llama-index-core>=0.14,<0.15",
    "llama-index-retrievers-bm25>=0.8.0",
    "mcp>=2.3.0",
    "numpy>=2.4.6",
    "openai>=1.50",
    "python-dotenv>=1.0",
    "tokenizers>=0.23.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inherit", "src/eval", "src/baselines"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
