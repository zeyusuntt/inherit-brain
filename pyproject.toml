[project]
name = "inherit-brain"
version = "0.1.0"
description = "A company brain on FalkorDB over the Salesforce HERB benchmark"
requires-python = ">=3.11,<3.12"
dependencies = [
    "openai>=1.50",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inherit"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
